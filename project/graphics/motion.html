<!doctype html><html><head><meta charset="utf-8"><style>
:root{--accent:#F2A33A}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
body{font-family:'Inter','Inter Display',sans-serif;color:#fff}
.scene{position:absolute;inset:0;display:none}
body[data-mode=intro] #intro,body[data-mode=outro] #outro{display:block}
.wrap{position:absolute;left:0;right:0;top:1130px;text-align:center}
.title{font-weight:800;font-size:112px;letter-spacing:.14em;text-shadow:0 6px 40px rgba(0,0,0,.55);
  display:inline-block;overflow:hidden;white-space:nowrap}
.title span{display:inline-block;transform:translateY(110%);opacity:0;animation:rise 1.1s cubic-bezier(.16,1,.3,1) forwards}
.line{height:3px;background:var(--accent);margin:34px auto 28px;width:0;box-shadow:0 0 18px rgba(242,163,58,.6);
  animation:grow 1.2s .55s cubic-bezier(.65,0,.35,1) forwards}
.sub{font-weight:500;font-size:34px;letter-spacing:.5em;padding-left:.5em;opacity:0;text-shadow:0 3px 20px rgba(0,0,0,.6);
  animation:fadein 1s 1.05s ease forwards}
.fade-out{animation:fadeout .8s 3.2s ease forwards}
@keyframes rise{to{transform:none;opacity:1}}
@keyframes grow{to{width:420px}}
@keyframes fadein{from{transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeout{to{opacity:0}}
#outro .wrap{top:880px}
#outro .sub{font-size:72px;font-weight:800;letter-spacing:.14em;animation-delay:.3s;animation-duration:1.2s}
.sub:empty{display:none}
#outro .line{animation-delay:.1s}
</style></head><body data-mode="intro">
<div id="intro" class="scene"><div class="wrap fade-out">
  <div class="title" id="t"></div><div class="line"></div><div class="sub" id="s"></div></div></div>
<div id="outro" class="scene"><div class="wrap"><div class="line"></div><div class="sub" id="o"></div></div></div>
<script>
window.setup=(cfg,mode)=>{
  document.documentElement.style.setProperty('--accent',cfg.accent);
  document.body.dataset.mode=mode;
  const t=document.getElementById('t');t.innerHTML='';
  [...cfg.title].forEach((c,i)=>{const e=document.createElement('span');e.textContent=c===' '?' ':c;e.style.animationDelay=(i*0.06)+'s';t.appendChild(e)});
  document.getElementById('s').textContent=cfg.title_sub;
  document.getElementById('o').textContent=cfg.outro;
};
window.seek=ms=>document.getAnimations().forEach(a=>{a.pause();a.currentTime=ms});
</script></body></html>
