<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'NSB';src:url('../assets/fonts/NotoSansBengali.ttf');font-weight:700}
html,body{margin:0;width:1080px;height:300px;background:transparent;overflow:hidden}
#w{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#t{font-family:'NSB',sans-serif;font-weight:700;font-size:94px;line-height:1.35;color:#fff;text-align:center;max-width:980px;
  paint-order:stroke fill;-webkit-text-stroke:12px rgba(8,8,10,.95);text-shadow:0 8px 26px rgba(0,0,0,.6)}
#t .hl{color:#FFD23F}
#u{height:7px;border-radius:4px;background:#F2A33A;margin-top:8px;box-shadow:0 0 18px rgba(242,163,58,.7)}
</style></head><body><div id="w"><div id="t"></div><div id="u"></div></div>
<script>
window.setup=async(h)=>{await document.fonts.load('700 94px NSB');document.getElementById('t').innerHTML=h};
window.at=(t,dur)=>{const e=x=>Math.max(0,Math.min(1,x));
  const pop=e(t/0.32);const s=pop<1?(0.55+0.55*(1-Math.pow(1-pop,3))*(1+0.18*Math.sin(pop*Math.PI))):1.0;
  const fade=Math.min(e(t/0.12),e((dur-t)/0.3));const drift=(1-e(t/0.4))*26;
  const w=document.getElementById('w');w.style.opacity=fade;w.style.transform=`translateY(${drift}px) scale(${s})`;
  document.getElementById('u').style.width=(520*e((t-0.12)/0.4))+'px'};
</script></body></html>
