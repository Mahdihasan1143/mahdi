<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>IFADA AI Promo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:720px;height:1280px;overflow:hidden;background:#fff;font-family:'Inter',sans-serif}
#stage{position:relative;width:720px;height:1280px;overflow:hidden}
.bg{position:absolute;inset:0}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
.txt{position:absolute;left:0;width:720px;text-align:center;font-weight:800;font-size:84px;line-height:1.05;letter-spacing:-2px;color:#2a1a7a}
.hl{display:inline-block;background:#6D4AFF;color:#fff;padding:0 18px;border-radius:14px}
.blob{position:absolute;width:640px;height:640px;border-radius:50%;filter:blur(40px)}
.msg{position:absolute;max-width:520px;border-radius:30px;padding:24px 30px;font-size:30px;font-weight:600;line-height:1.25;box-shadow:0 24px 60px rgba(20,10,80,.35)}
.msg.c{background:#fff;color:#1F2937;border-bottom-left-radius:8px}
.msg.a{background:linear-gradient(135deg,#6D4AFF,#9b7bff);color:#fff;border-bottom-right-radius:8px}
.msg small{display:block;font-size:20px;font-weight:700;opacity:.65;margin-bottom:6px;letter-spacing:1px}
.shot{position:absolute;left:30px;width:660px;border-radius:26px;overflow:hidden;box-shadow:0 40px 90px rgba(60,30,160,.35);background:#fff;border:1px solid #e6e3ff}
.shot img{display:block;width:100%}
.chip{position:absolute;background:#fff;color:#4a2fd0;font-weight:700;font-size:34px;padding:20px 34px;border-radius:60px;box-shadow:0 16px 40px rgba(60,30,160,.22);white-space:nowrap}
.pill{display:inline-block;font-weight:800;font-size:40px;padding:26px 64px;border-radius:70px;background:#fff;color:#4a2fd0}
</style></head><body>
<div id="stage">
 <div class="bg" id="bg"></div>
 <div class="blob" id="b1"></div><div class="blob" id="b2"></div>
 <div id="layer"></div>
</div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const mix=(a,b,k)=>a+(b-a)*k;
const layer=document.getElementById('layer'),bg=document.getElementById('bg');
const els=[];const extras=[];
function add(html,cls,style,anim){const d=document.createElement('div');d.className=cls;d.style.cssText=style||'';d.innerHTML=html;layer.appendChild(d);els.push({d,anim});return d}
function win(t0,t1,f=.4){return t=>clamp((t-t0)/f)*clamp((t1-t)/f)}
const logo='<span style="display:inline-grid;place-items:center;width:1em;height:1em;border-radius:.28em;background:#6D4AFF;vertical-align:-.1em;margin-right:.18em"><svg width=".6em" height=".6em" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/></svg></span>';
// S1 hook 0-3.3
add('Replying to every<br><span class="hl">customer?</span>','txt','top:470px',t=>({o:win(0,3.3,.35)(t),y:mix(60,0,ease(t/.6)),s:mix(.9,1,ease(t/.6))}));
// S2 chat 3.2-6.6
[['c','CUSTOMER','Assalamu alaikum, 1HP solar pump er chobi dekhaben?',70,250],['c','CUSTOMER','Price koto? Warranty ache?',380,450],['c','CUSTOMER','Ekhoni order dibo, kothay pabo?',690,260],['c','CUSTOMER','Kal rate-o reply paini...',980,420]].forEach(([k,who,txt,y,x],i)=>{
 add('<small>'+who+'</small>'+txt,'msg '+k,'left:0;top:0;width:'+(i%2?470:520)+'px',t=>{const t0=3.2+i*.4;const kk=back((t-t0)/.6);
  return {o:clamp((t-t0)/.15)*clamp((6.5-t)/.35),x:mix(i%2?900:-700,i%2?200:50,kk),y:y+Math.sin(t*1.7+i*2)*12,r:(i%2?2:-2)}})});
// S3 brand 6.4-10
add('<div style="font-size:30px;font-weight:700;letter-spacing:6px;color:#d6caff;margin-bottom:22px">MEET</div><div style="font-size:120px;color:#fff">'+logo+'IFADA AI</div>','txt','top:440px',t=>({o:win(6.4,10,.4)(t),y:mix(80,0,ease((t-6.4)/.7)),s:mix(.85,1,back((t-6.4)/.8))}));
add('Your AI sales assistant for<br>WhatsApp &amp; website chats','txt','top:780px;font-size:40px;font-weight:600;letter-spacing:0;color:#e6defe',t=>({o:win(7.2,10,.4)(t),y:mix(30,0,ease((t-7.2)/.6))}));
// S4 dashboard 9.8-13.6
function shotScene(src,aspect,t0,t1,title,sub,top){
 add(title,'txt','top:120px;font-size:68px',t=>({o:win(t0,t1,.35)(t),y:mix(-40,0,ease((t-t0)/.5))}));
 add('<img src="ai-assets/'+src+'">','shot','top:'+top+'px',t=>({o:win(t0,t1,.35)(t),x:mix(500,0,ease((t-t0)/.7)),y:Math.sin(t*1.6)*10,r:mix(4,-1.5,ease((t-t0)/.8))}));
 add(sub,'txt','top:1010px;font-size:36px;font-weight:600;letter-spacing:0;color:#5b4fa8;padding:0 60px',t=>({o:win(t0+.4,t1,.35)(t)}));
}
shotScene('dashboard.jpg',0,9.8,13.6,'Every chat,<br>one dashboard','See customers, leads and AI replies live',520);
// ---- Pipeline drag scene 13.4-20.0
(function(){
 const P0=13.4,P1=20.0,T0=14.6,HOP=1.0,N=6,CW=210,GAP=14,PADL=16,BTOP=96;
 const names=['New','Contacted','Qualified','Proposal','Negotiation','Won ✓'];
 const dots=['#3b82f6','#6366f1','#8b5cf6','#a855f7','#f97316','#10b981'];
 add('Turn chats<br>into sales','txt','top:120px;font-size:68px',t=>({o:win(P0,P1,.35)(t),y:mix(-40,0,ease((t-P0)/.5))}));
 const board=add('','shot','top:470px;height:470px;background:#f4f3fb',t=>({o:win(P0,P1,.35)(t),x:mix(500,0,ease((t-P0)/.7)),y:Math.sin(t*1.6)*6}));
 board.innerHTML='<div style="padding:22px 26px 0"><div style="font-weight:800;font-size:34px;color:#111">Sales Pipeline</div><div style="font-size:20px;color:#6b7280;margin-top:2px">1 deal</div></div><div id="track" style="position:absolute;left:0;top:'+BTOP+'px;height:360px;width:'+(PADL*2+N*(CW+GAP))+'px"></div><div id="dealcard" style="position:absolute;left:0;top:0;width:'+(CW-28)+'px;background:#fff;border-radius:16px;padding:16px;box-shadow:0 8px 20px rgba(60,30,160,.18);border:2px solid #fff;z-index:5"><div style="font-weight:700;font-size:21px;color:#111;line-height:1.2">New inquiry from Demo Customer</div><div style="display:flex;align-items:center;gap:10px;margin-top:12px"><span style="width:30px;height:30px;border-radius:50%;background:#14b8a6;color:#fff;font-weight:700;font-size:16px;display:grid;place-items:center">D</span><span style="font-size:18px;color:#374151">Demo Customer</span></div><div style="display:flex;justify-content:space-between;margin-top:12px;font-size:17px;color:#6366f1;font-weight:700"><span>Tk 0</span><span style="color:#9ca3af;font-weight:500">1 follow-up</span></div></div>';
 const track=board.querySelector('#track'),card=board.querySelector('#dealcard');
 const cols=[];
 for(let i=0;i<N;i++){const c=document.createElement('div');c.style.cssText='position:absolute;top:0;height:340px;width:'+CW+'px;border-radius:18px;background:#ebebf0;left:'+(PADL+i*(CW+GAP))+'px';
  c.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;padding:16px 16px 0"><span style="font-weight:700;font-size:21px;color:#111"><i style="display:inline-block;width:12px;height:12px;border-radius:50%;background:'+dots[i]+';margin-right:8px"></i>'+names[i]+'</span><span class="cnt" style="background:#fff;border-radius:12px;padding:2px 12px;font-size:18px;color:#6b7280;font-weight:600">0</span></div><div class="drop" style="position:absolute;left:14px;right:14px;top:70px;bottom:14px;border:2px dashed #d4d4dc;border-radius:14px;display:grid;place-items:center;font-size:18px;color:#a1a1aa">Drop a deal here</div>';
  track.appendChild(c);cols.push(c)}
 const cur=add('<svg width="56" height="56" viewBox="0 0 24 24"><path d="M4 2l15 9-6.5 1.8L9.8 19z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>','abs','z-index:20;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))',null);
 const rip=add('','abs','z-index:19;width:70px;height:70px;border-radius:50%;border:5px solid #6D4AFF;margin:-35px 0 0 -35px',null);
 add('Deal won!','txt','top:1000px;font-size:46px;color:#059669',t=>({o:clamp((t-(T0+5*HOP-.05))/.3)*clamp((P1-t)/.35),s:mix(.7,1,back((t-(T0+5*HOP))/.5))}));
 add('Drag every deal from New to Won','txt','top:1000px;font-size:34px;font-weight:600;letter-spacing:0;color:#5b4fa8;padding:0 50px',t=>({o:win(P0+.5,T0+5*HOP-.1,.3)(t)}));
 const colX=i=>PADL+i*(CW+GAP);
 const state=t=>{
  const k=Math.floor((t-T0)/HOP);
  if(t<T0)return {bx:colX(0)+14,lift:0,occ:0};
  if(k>=5)return {bx:colX(5)+14,lift:0,occ:5};
  const p=t-T0-k*HOP; const d=ease((p-.35)/.5);
  const lift=clamp((p-.25)/.1)*(1-clamp((p-.85)/.12));
  return {bx:mix(colX(k),colX(k+1),d)+14,lift,occ:d>=.5?k+1:k}};
 extras.push(t=>{
  const st=state(t);const cy=BTOP+70+14;
  const cardW=CW-28, cx=st.bx+cardW/2;
  const pan=Math.min(Math.max(0,cx-330),PADL*2+N*(CW+GAP)-660);
  track.style.transform='translateX('+(-pan)+'px)';
  card.style.transform='translate('+(st.bx-pan)+'px,'+(cy-st.lift*10)+'px) scale('+(1+.06*st.lift)+') rotate('+(3*st.lift)+'deg)';
  card.style.boxShadow=st.lift>0?'0 24px 40px rgba(60,30,160,.32)':'0 8px 20px rgba(60,30,160,.18)';
  const wonDone=t>=T0+5*HOP;
  card.style.borderColor=wonDone?'#10b981':'#fff';
  cols.forEach((c,i)=>{c.querySelector('.cnt').textContent=(i===st.occ?1:0);
   c.querySelector('.drop').style.display=(i===st.occ)?'none':'grid';
   c.style.background=(i===5&&wonDone)?'#d9f7e8':'#ebebf0'});
  const boardTop=470+Math.sin(t*1.6)*6, boardLeft=30+(t<P0?500:mix(500,0,ease((t-P0)/.7)));
  const tx=boardLeft+(st.bx-pan)+cardW*.62, ty=boardTop+cy+70-st.lift*10;
  let X,Y,o;
  const ts=T0-1.1;
  if(t<ts){X=760;Y=1150;o=0}
  else if(t<T0+.25){const k=ease((t-ts)/1.35);X=mix(760,tx,k);Y=mix(1150,ty,k);o=clamp((t-ts)/.2)}
  else {X=tx;Y=ty;o=1; if(t>T0+5*HOP+.3){const k=ease((t-(T0+5*HOP+.3))/.8);X=mix(tx,tx+120,k);Y=mix(ty,ty+220,k);o=1-k}}
  o*=clamp((P1-t)/.3);
  cur.style.opacity=o;cur.style.visibility=o<=.001?'hidden':'visible';
  cur.style.transform='translate('+(X-6)+'px,'+(Y-6)+'px) scale('+(1-.12*st.lift)+')';
  let rk=-1;if(t>=T0&&t<T0+5*HOP){const p=(t-T0)%HOP; if(p>=.25&&p<.6)rk=(p-.25)/.35}
  rip.style.opacity=rk<0?0:(1-rk)*.8;rip.style.visibility=rk<0?'hidden':'visible';
  rip.style.transform='translate('+(X+4)+'px,'+(Y+4)+'px) scale('+(.4+rk*1.2)+')';
 });
})();

// S5 feature chips 19.8-20.2
const feats=['Live Chat','Leads','Follow-ups','Knowledge Base','Train AI','Analytics','Team Members'];
add('Everything<br>in one place','txt','top:110px;font-size:76px',t=>({o:win(19.8,23.3,.35)(t),y:mix(-40,0,ease((t-19.8)/.5))}));
feats.forEach((f,i)=>{const y=400+i*115,x=[90,300,150,260,110,330,200][i];
 add(f,'chip','left:0;top:0',t=>{const t0=20+i*.2;return {o:win(t0,23.3,.3)(t),x:mix(i%2?800:-500,x,back((t-t0)/.55)),y:y+Math.sin(t*2+i)*8}})});
// S6 CTA 20-24
add('<div style="font-size:84px;font-weight:800;color:#fff;letter-spacing:-2px">'+logo+'IFADA AI</div>','txt','top:300px',t=>({o:clamp((t-23.2)/.4),y:mix(50,0,ease((t-23.2)/.6))}));
add('Never miss<br>a customer<br>again','txt','top:450px;color:#fff;font-size:92px',t=>({o:clamp((t-23.5)/.4),s:mix(.85,1,back((t-23.5)/.7))}));
add('<div class="pill">Call 01963 920520</div>','txt','top:900px',t=>({o:clamp((t-24.2)/.4),y:mix(40,0,ease((t-24.2)/.5)),s:1+Math.sin(t*5)*.025}));
add('Ifada Electronics · Mirpur-12, Dhaka','txt','top:1080px;font-size:28px;font-weight:600;letter-spacing:0;color:#d6caff',t=>({o:clamp((t-24.7)/.4)}));

const C={light:['#ffffff','#efeaff'],dark:['#1a1050','#0d0830'],brand:['#6D4AFF','#4326c9']};
function hex(h){return [1,3,5].map(i=>parseInt(h.substr(i,2),16))}
function lc(a,b,k){const A=hex(a),B=hex(b);return '#'+A.map((v,i)=>Math.round(mix(v,B[i],clamp(k))).toString(16).padStart(2,'0')).join('')}
function tr(a,b,t,t0,d=.4){const k=(t-t0)/d;return [lc(a[0],b[0],k),lc(a[1],b[1],k)]}
function bgAt(t){
 if(t<3.2)return C.light; if(t<3.6)return tr(C.light,C.dark,t,3.2);
 if(t<6.3)return C.dark; if(t<6.7)return tr(C.dark,C.brand,t,6.3);
 if(t<9.8)return C.brand; if(t<10.2)return tr(C.brand,C.light,t,9.8);
 if(t<23.1)return C.light; if(t<23.5)return tr(C.light,C.brand,t,23.1);
 return C.brand}
window.render=function(t){
 const c=bgAt(t);bg.style.background='linear-gradient(180deg,'+c[0]+','+c[1]+')';
 const dark=(t>=3.2&&t<10)||t>=23.1;
 const b1=document.getElementById('b1'),b2=document.getElementById('b2');
 b1.style.background=dark?'radial-gradient(circle,rgba(160,130,255,.55),rgba(160,130,255,0) 70%)':'radial-gradient(circle,rgba(109,74,255,.28),rgba(109,74,255,0) 70%)';
 b2.style.background=dark?'radial-gradient(circle,rgba(70,200,255,.35),rgba(70,200,255,0) 70%)':'radial-gradient(circle,rgba(0,200,160,.2),rgba(0,200,160,0) 70%)';
 b1.style.transform='translate('+(-160+Math.sin(t*.7)*90)+'px,'+(-120+Math.cos(t*.5)*80)+'px)';
 b2.style.transform='translate('+(300+Math.cos(t*.6)*80)+'px,'+(780+Math.sin(t*.8)*90)+'px)';
 els.forEach(({d,anim})=>{if(!anim)return;const a=anim(t);const o=a.o===undefined?1:a.o;
  d.style.opacity=o;d.style.visibility=o<=0.001?'hidden':'visible';
  d.style.transform='translate('+(a.x||0)+'px,'+(a.y||0)+'px) scale('+(a.s===undefined?1:a.s)+') rotate('+(a.r||0)+'deg)'});
 extras.forEach(f=>f(t));
};
render(0);
</script></body></html>
