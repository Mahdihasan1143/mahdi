<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:720px;height:1280px;overflow:hidden;background:#fff;font-family:'Inter',sans-serif}
#stage{position:relative;width:720px;height:1280px;overflow:hidden}
.bg{position:absolute;inset:0}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
.txt{position:absolute;left:0;width:720px;text-align:center;font-weight:800;font-size:84px;line-height:1.05;letter-spacing:-2px;color:#2a1a7a}
.hl{display:inline-block;background:#6D4AFF;color:#fff;padding:0 18px;border-radius:14px}

.xcard img{display:block;width:100%}
.xtag{position:absolute;left:18px;top:14px;background:#6D4AFF;color:#fff;font-weight:700;font-size:22px;padding:6px 18px;border-radius:20px}
.msg{position:absolute;max-width:520px;border-radius:30px;padding:24px 30px;font-size:30px;font-weight:600;line-height:1.25;box-shadow:0 24px 60px rgba(20,10,80,.35)}

.msg.a{background:linear-gradient(135deg,#6D4AFF,#9b7bff);color:#fff;border-bottom-right-radius:8px}
.msg small{display:block;font-size:20px;font-weight:700;opacity:.65;margin-bottom:6px;letter-spacing:1px}
.shot{position:absolute;left:30px;width:660px;border-radius:26px;overflow:hidden;box-shadow:0 40px 90px rgba(60,30,160,.35);background:#fff;border:1px solid #e6e3ff}
.shot img{display:block;width:100%}
.chip{position:absolute;background:rgba(255,255,255,.7);backdrop-filter:blur(14px);border:1.5px solid rgba(255,255,255,.95);color:#4a2fd0;font-weight:700;font-size:34px;padding:20px 34px;border-radius:60px;box-shadow:0 16px 40px rgba(60,30,160,.22);white-space:nowrap}
.pill{display:inline-block;font-weight:800;font-size:40px;padding:26px 64px;border-radius:70px;background:#fff;color:#4a2fd0}

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const mix=(a,b,k)=>a+(b-a)*k;
const layer=document.getElementById('layer'),bg=document.getElementById('bg');
const els=[];const extras=[];
function add(html,cls,style,anim){const d=document.createElement('div');d.className=cls;d.style.cssText=style||'';d.innerHTML=html;layer.appendChild(d);els.push({d,anim});return d}
function win(t0,t1,f=.4){return t=>clamp((t-t0)/f)*clamp((t1-t)/f)}

[['c','CUSTOMER','Assalamu alaikum, 1HP solar pump er chobi dekhaben?',70,250],['c','CUSTOMER','Price koto? Warranty ache?',380,450],['c','CUSTOMER','Ekhoni order dibo, kothay pabo?',690,260],['c','CUSTOMER','Kal rate-o reply paini...',980,420]].forEach(([k,who,txt,y,x],i)=>{

 const board=add('','shot','top:470px;height:470px;background:#f4f3fb',t=>({o:win(P0,P1,.35)(t),x:mix(500,0,ease((t-P0)/.7)),y:Math.sin(t*1.6)*6}));
 board.innerHTML='<div style="padding:22px 26px 0"><div style="font-weight:800;font-size:34px;color:#111">Sales Pipeline</div><div style="font-size:20px;color:#6b7280;margin-top:2px">1 deal</div></div><div id="track" style="position:absolute;left:0;top:'+BTOP+'px;height:360px;width:'+(PADL*2+N*(CW+GAP))+'px"></div><div id="dealcard" style="position:absolute;left:0;top:0;width:'+(CW-28)+'px;background:#fff;border-radius:16px;padding:16px;box-shadow:0 8px 20px rgba(60,30,160,.18);border:2px solid #fff;z-index:5"><div style="font-weight:700;font-size:21px;color:#111;line-height:1.2">New inquiry from Demo Customer</div><div style="display:flex;align-items:center;gap:10px;margin-top:12px"><span style="width:30px;height:30px;border-radius:50%;background:#14b8a6;color:#fff;font-weight:700;font-size:16px;display:grid;place-items:center">D</span><span style="font-size:18px;color:#374151">Demo Customer</span></div><div style="display:flex;justify-content:space-between;margin-top:12px;font-size:17px;color:#6366f1;font-weight:700"><span>Tk 0</span><span style="color:#9ca3af;font-weight:500">1 follow-up</span></div></div>';
 const track=board.querySelector('#track'),card=board.querySelector('#dealcard');
 const cols=[];
 for(let i=0;i<N;i++){const c=document.createElement('div');c.style.cssText='position:absolute;top:0;height:340px;width:'+CW+'px;border-radius:18px;background:#ebebf0;left:'+(PADL+i*(CW+GAP))+'px';

  track.appendChild(c);cols.push(c)}
 const cur=add('<svg width="56" height="56" viewBox="0 0 24 24"><path d="M4 2l15 9-6.5 1.8L9.8 19z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>','abs','z-index:20;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))',null);
 const rip=add('','abs','z-index:19;width:70px;height:70px;border-radius:50%;border:5px solid #6D4AFF;margin:-35px 0 0 -35px',null);
 add('Deal won!','txt','top:1000px;font-size:46px;color:#059669',t=>({o:clamp((t-(T0+5*HOP-.05))/.3)*clamp((P1-t)/.35),s:mix(.7,1,back((t-(T0+5*HOP))/.5))}));
 add('Drag every deal from New to Won','txt','top:1000px;font-size:34px;font-weight:600;letter-spacing:0;color:#5b4fa8;padding:0 50px',t=>({o:win(P0+.5,T0+5*HOP-.1,.3)(t)}));
 const colX=i=>PADL+i*(CW+GAP);
 const state=t=>{

  if(t<T0)return {bx:colX(0)+14,lift:0,occ:0};
  if(k>=5)return {bx:colX(5)+14,lift:0,occ:5};
  const p=t-T0-k*HOP; const d=ease((p-.35)/.5);
  const lift=clamp((p-.25)/.1)*(1-clamp((p-.85)/.12));
  return {bx:mix(colX(k),colX(k+1),d)+14,lift,occ:d>=.5?k+1:k}};
 extras.push(t=>{
  const st=state(t);const cy=BTOP+70+14;
  const cardW=CW-28, cx=st.bx+cardW/2;
  const pan=Math.min(Math.max(0,cx-330),PADL*2+N*(CW+GAP)-660);

  card.style.transform='translate('+(st.bx-pan)+'px,'+(cy-st.lift*10)+'px) scale('+(1+.06*st.lift)+') rotate('+(3*st.lift)+'deg)';

   c.querySelector('.drop').style.display=(i===st.occ)?'none':'grid';
   c.style.background=(i===5&&wonDone)?'#d9f7e8':'#ebebf0'});
  const boardTop=470+Math.sin(t*1.6)*6, boardLeft=30+(t<P0?500:mix(500,0,ease((t-P0)/.7)));
  const tx=boardLeft+(st.bx-pan)+cardW*.62, ty=boardTop+cy+70-st.lift*10;
  let X,Y,o;
  const ts=T0-1.1;

(function(){const A=20.0,B=23.4;

const C={light:['#ffffff','#efeaff'],dark:['#1a1050','#0d0830'],brand:['#6D4AFF','#4326c9']};
function hex(h){return [1,3,5].map(i=>parseInt(h.substr(i,2),16))}
function lc(a,b,k){const A=hex(a),B=hex(b);return '#'+A.map((v,i)=>Math.round(mix(v,B[i],clamp(k))).toString(16).padStart(2,'0')).join('')}
function tr(a,b,t,t0,d=.4){const k=(t-t0)/d;return [lc(a[0],b[0],k),lc(a[1],b[1],k)]}
function bgAt(t){
 if(t<3.2)return C.light; if(t<3.6)return tr(C.light,C.dark,t,3.2);
 if(t<6.3)return C.dark; if(t<6.7)return tr(C.dark,C.brand,t,6.3);
 if(t<9.8)return C.brand; if(t<10.2)return tr(C.brand,C.light,t,9.8);
 if(t<26.9)return C.light; if(t<27.3)return tr(C.light,C.brand,t,26.9);
 return C.brand}
window.render=function(t){
 const c=bgAt(t);bg.style.background='linear-gradient(180deg,'+c[0]+','+c[1]+')';
 const dark=(t>=3.2&&t<10)||t>=26.9;
 const bl=[document.getElementById('b1'),document.getElementById('b2'),document.getElementById('b3')];
 const cols=dark?['rgba(150,120,255,.75)','rgba(60,190,255,.55)','rgba(255,130,220,.4)']:['rgba(59,107,255,.55)','rgba(150,110,255,.5)','rgba(70,200,255,.45)'];
 const pos=[[-200+Math.sin(t*.6)*120,-160+Math.cos(t*.45)*110],[300+Math.cos(t*.5)*110,700+Math.sin(t*.7)*120],[-120+Math.sin(t*.4+2)*140,420+Math.cos(t*.55)*100]];
 bl.forEach((b,i)=>{b.style.background='radial-gradient(circle,'+cols[i]+','+cols[i].replace(/[\d.]+\)$/,'0)')+' 70%)';
  const m=(a)=>Math.round(50+Math.sin(t*(.8+i*.25)+a)*14);
  b.style.borderRadius=m(0)+'% '+m(1.5)+'% '+m(3)+'% '+m(4.5)+'% / '+m(2)+'% '+m(3.5)+'% '+m(5)+'% '+m(.7)+'%';
  b.style.transform='translate('+pos[i][0]+'px,'+pos[i][1]+'px) rotate('+(t*8*(i+1))+'deg)'});
 els.forEach(({d,anim})=>{if(!anim)return;const a=anim(t);const o=a.o===undefined?1:a.o;
  d.style.opacity=o;d.style.visibility=o<=0.001?'hidden':'visible';
  d.style.transform='perspective(1400px) translate('+(a.x||0)+'px,'+(a.y||0)+'px) rotateX('+(a.rx||0)+'deg) rotateY('+(a.ry||0)+'deg) scale('+(a.s===undefined?1:a.s)+') rotate('+(a.r||0)+'deg)';
  if(a.b!==undefined)d.style.filter=a.b>0.05?'blur('+a.b+'px)':'none'});
 extras.forEach(f=>f(t));
};
render(0);
</script></body></html>
