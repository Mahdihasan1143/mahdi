<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>IFADA AI Promo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:720px;height:1280px;overflow:hidden;background:#fff;font-family:'Inter',sans-serif}
#stage{position:relative;width:720px;height:1280px;overflow:hidden}
.bg{position:absolute;inset:0}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
.txt{position:absolute;left:0;width:720px;text-align:center;font-weight:800;font-size:84px;line-height:1.05;letter-spacing:-2px;color:#2a1a7a}
.hl{display:inline-block;background:#6D4AFF;color:#fff;padding:0 18px;border-radius:14px}
.blob{position:absolute;width:640px;height:640px;border-radius:50%;filter:blur(40px)}
.msg{position:absolute;max-width:520px;border-radius:30px;padding:24px 30px;font-size:30px;font-weight:600;line-height:1.25;box-shadow:0 24px 60px rgba(20,10,80,.35)}
.msg.c{background:#fff;color:#1F2937;border-bottom-left-radius:8px}
.msg.a{background:linear-gradient(135deg,#6D4AFF,#9b7bff);color:#fff;border-bottom-right-radius:8px}
.msg small{display:block;font-size:20px;font-weight:700;opacity:.65;margin-bottom:6px;letter-spacing:1px}
.shot{position:absolute;left:30px;width:660px;border-radius:26px;overflow:hidden;box-shadow:0 40px 90px rgba(60,30,160,.35);background:#fff;border:1px solid #e6e3ff}
.shot img{display:block;width:100%}
.chip{position:absolute;background:#fff;color:#4a2fd0;font-weight:700;font-size:34px;padding:20px 34px;border-radius:60px;box-shadow:0 16px 40px rgba(60,30,160,.22);white-space:nowrap}
.pill{display:inline-block;font-weight:800;font-size:40px;padding:26px 64px;border-radius:70px;background:#fff;color:#4a2fd0}
</style></head><body>
<div id="stage">
 <div class="bg" id="bg"></div>
 <div class="blob" id="b1"></div><div class="blob" id="b2"></div>
 <div id="layer"></div>
</div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const mix=(a,b,k)=>a+(b-a)*k;
const layer=document.getElementById('layer'),bg=document.getElementById('bg');
const els=[];
function add(html,cls,style,anim){const d=document.createElement('div');d.className=cls;d.style.cssText=style||'';d.innerHTML=html;layer.appendChild(d);els.push({d,anim});return d}
function win(t0,t1,f=.4){return t=>clamp((t-t0)/f)*clamp((t1-t)/f)}
const logo='<span style="display:inline-grid;place-items:center;width:1em;height:1em;border-radius:.28em;background:#6D4AFF;vertical-align:-.1em;margin-right:.18em"><svg width=".6em" height=".6em" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/></svg></span>';
// S1 hook 0-3.3
add('Replying to every<br><span class="hl">customer?</span>','txt','top:470px',t=>({o:win(0,3.3,.35)(t),y:mix(60,0,ease(t/.6)),s:mix(.9,1,ease(t/.6))}));
// S2 chat 3.2-6.6
[['c','CUSTOMER','Assalamu alaikum, 1HP solar pump er chobi dekhaben?',70,250],['c','CUSTOMER','Price koto? Warranty ache?',380,450],['c','CUSTOMER','Ekhoni order dibo, kothay pabo?',690,260],['c','CUSTOMER','Kal rate-o reply paini...',980,420]].forEach(([k,who,txt,y,x],i)=>{
 add('<small>'+who+'</small>'+txt,'msg '+k,'left:0;top:0;width:'+(i%2?470:520)+'px',t=>{const t0=3.2+i*.4;const kk=back((t-t0)/.6);
  return {o:clamp((t-t0)/.15)*clamp((6.5-t)/.35),x:mix(i%2?900:-700,i%2?200:50,kk),y:y+Math.sin(t*1.7+i*2)*12,r:(i%2?2:-2)}})});
// S3 brand 6.4-10
add('<div style="font-size:30px;font-weight:700;letter-spacing:6px;color:#d6caff;margin-bottom:22px">MEET</div><div style="font-size:120px;color:#fff">'+logo+'IFADA AI</div>','txt','top:440px',t=>({o:win(6.4,10,.4)(t),y:mix(80,0,ease((t-6.4)/.7)),s:mix(.85,1,back((t-6.4)/.8))}));
add('Your AI sales assistant for<br>WhatsApp &amp; website chats','txt','top:780px;font-size:40px;font-weight:600;letter-spacing:0;color:#e6defe',t=>({o:win(7.2,10,.4)(t),y:mix(30,0,ease((t-7.2)/.6))}));
// S4 dashboard 9.8-13.6
function shotScene(src,aspect,t0,t1,title,sub,top){
 add(title,'txt','top:120px;font-size:68px',t=>({o:win(t0,t1,.35)(t),y:mix(-40,0,ease((t-t0)/.5))}));
 add('<img src="ai-assets/'+src+'">','shot','top:'+top+'px',t=>({o:win(t0,t1,.35)(t),x:mix(500,0,ease((t-t0)/.7)),y:Math.sin(t*1.6)*10,r:mix(4,-1.5,ease((t-t0)/.8))}));
 add(sub,'txt','top:1010px;font-size:36px;font-weight:600;letter-spacing:0;color:#5b4fa8;padding:0 60px',t=>({o:win(t0+.4,t1,.35)(t)}));
}
shotScene('dashboard.jpg',0,9.8,13.6,'Every chat,<br>one dashboard','See customers, leads and AI replies live',520);
shotScene('pipeline.jpg',0,13.4,17,'Turn chats<br>into sales','Track every deal from New to Won',540);
// S5 feature chips 16.8-20.2
const feats=['Live Chat','Leads','Follow-ups','Knowledge Base','Train AI','Analytics','Team Members'];
add('Everything<br>in one place','txt','top:110px;font-size:76px',t=>({o:win(16.8,20.3,.35)(t),y:mix(-40,0,ease((t-16.8)/.5))}));
feats.forEach((f,i)=>{const y=400+i*115,x=[90,300,150,260,110,330,200][i];
 add(f,'chip','left:0;top:0',t=>{const t0=17+i*.2;return {o:win(t0,20.3,.3)(t),x:mix(i%2?800:-500,x,back((t-t0)/.55)),y:y+Math.sin(t*2+i)*8}})});
// S6 CTA 20-24
add('<div style="font-size:84px;font-weight:800;color:#fff;letter-spacing:-2px">'+logo+'IFADA AI</div>','txt','top:300px',t=>({o:clamp((t-20.2)/.4),y:mix(50,0,ease((t-20.2)/.6))}));
add('Never miss<br>a customer<br>again','txt','top:450px;color:#fff;font-size:92px',t=>({o:clamp((t-20.5)/.4),s:mix(.85,1,back((t-20.5)/.7))}));
add('<div class="pill">Call 01963 920520</div>','txt','top:900px',t=>({o:clamp((t-21.2)/.4),y:mix(40,0,ease((t-21.2)/.5)),s:1+Math.sin(t*5)*.025}));
add('Ifada Electronics · Mirpur-12, Dhaka','txt','top:1080px;font-size:28px;font-weight:600;letter-spacing:0;color:#d6caff',t=>({o:clamp((t-21.7)/.4)}));

const C={light:['#ffffff','#efeaff'],dark:['#1a1050','#0d0830'],brand:['#6D4AFF','#4326c9']};
function hex(h){return [1,3,5].map(i=>parseInt(h.substr(i,2),16))}
function lc(a,b,k){const A=hex(a),B=hex(b);return '#'+A.map((v,i)=>Math.round(mix(v,B[i],clamp(k))).toString(16).padStart(2,'0')).join('')}
function tr(a,b,t,t0,d=.4){const k=(t-t0)/d;return [lc(a[0],b[0],k),lc(a[1],b[1],k)]}
function bgAt(t){
 if(t<3.2)return C.light; if(t<3.6)return tr(C.light,C.dark,t,3.2);
 if(t<6.3)return C.dark; if(t<6.7)return tr(C.dark,C.brand,t,6.3);
 if(t<9.8)return C.brand; if(t<10.2)return tr(C.brand,C.light,t,9.8);
 if(t<20.1)return C.light; if(t<20.5)return tr(C.light,C.brand,t,20.1);
 return C.brand}
window.render=function(t){
 const c=bgAt(t);bg.style.background='linear-gradient(180deg,'+c[0]+','+c[1]+')';
 const dark=(t>=3.2&&t<10)||t>=20.1;
 const b1=document.getElementById('b1'),b2=document.getElementById('b2');
 b1.style.background=dark?'radial-gradient(circle,rgba(160,130,255,.55),rgba(160,130,255,0) 70%)':'radial-gradient(circle,rgba(109,74,255,.28),rgba(109,74,255,0) 70%)';
 b2.style.background=dark?'radial-gradient(circle,rgba(70,200,255,.35),rgba(70,200,255,0) 70%)':'radial-gradient(circle,rgba(0,200,160,.2),rgba(0,200,160,0) 70%)';
 b1.style.transform='translate('+(-160+Math.sin(t*.7)*90)+'px,'+(-120+Math.cos(t*.5)*80)+'px)';
 b2.style.transform='translate('+(300+Math.cos(t*.6)*80)+'px,'+(780+Math.sin(t*.8)*90)+'px)';
 els.forEach(({d,anim})=>{const a=anim(t);const o=a.o===undefined?1:a.o;
  d.style.opacity=o;d.style.visibility=o<=0.001?'hidden':'visible';
  d.style.transform='translate('+(a.x||0)+'px,'+(a.y||0)+'px) scale('+(a.s===undefined?1:a.s)+') rotate('+(a.r||0)+'deg)'});
};
render(0);
</script></body></html>
